# master-governance v1.1.0 · managed copy, do not edit here. Change it in
# github.com/muhammedalradi-hue/master-governance and run scripts/sync.sh.

have_fun: false

code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1

  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false

ignore_patterns:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - ".next/**"
  - "coverage/**"
  - "*.lock"
  - "package-lock.json"
