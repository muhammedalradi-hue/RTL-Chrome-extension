<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إعدادات Mango Tools</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1><img class="logo" src="icons/on-128.png" alt="" width="28" height="28" />Mango Tools</h1>

      <section id="dictation" class="block">
        <h2>الإملاء</h2>

        <div class="field">
          <label for="dict-key">مفتاح Gemini</label>
          <div class="secret" dir="ltr">
            <input id="dict-key" type="password" dir="ltr" autocomplete="off" spellcheck="false" />
            <button id="dict-key-eye" type="button" class="eye" aria-label="إظهار المفتاح" title="إظهار المفتاح">
              <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M3 3l18 18" />
                <path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="dict-lang">اللغة</label>
          <select id="dict-lang">
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="row">
          <span class="row-name">الميكروفون</span>
          <span id="mic-state" class="state"></span>
          <button id="mic-btn" type="button" hidden>السماح بالميكروفون</button>
        </div>
        <p id="mic-denied" class="error" hidden>اسمح به من إعدادات الموقع في Chrome.</p>

        <div class="row">
          <span class="row-name">الاختصار</span>
          <kbd id="shortcut" dir="ltr"></kbd>
          <button id="shortcut-btn" type="button">تغيير</button>
        </div>
      </section>

      <section class="block">
        <h2>المواقع الدائمة</h2>

        <section id="grant-box" class="grant" hidden>
          <p id="grant-text"></p>
          <button id="grant-btn" type="button" class="primary">منح الإذن وتثبيت الموقع</button>
        </section>

        <ul id="sites" class="sites"></ul>
        <p id="empty" class="empty" hidden>لا توجد مواقع دائمة بعد.</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
